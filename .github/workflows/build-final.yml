name: Build mssh final ZIP

on:
  push:
    paths:
      - 'mssh-final-auto.zip'
      - '.github/workflows/build-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mssh-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('final-source').resolve()
          root.mkdir()
          with ZipFile('mssh-final-auto.zip') as z:
              for item in z.infolist():
                  if not (root / item.filename).resolve().is_relative_to(root):
                      raise ValueError('Unsafe ZIP path')
              if z.testzip() is not None:
                  raise ValueError('Corrupt archive')
              z.extractall(root)
          for name in ('settings.gradle.kts', 'app/build.gradle.kts', 'app/src/main/jni/hev/Android.mk'):
              if not (root / name).is_file():
                  raise FileNotFoundError(name)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, test and lint
        working-directory: final-source
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: APK checksum
        working-directory: final-source/app/build/outputs/apk/debug
        run: sha256sum *.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mssh-final-debug
          path: |
            final-source/app/build/outputs/apk/debug/*.apk
            final-source/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mssh-build-diagnostics
          path: |
            final-source/build.log
            final-source/app/build/reports/
          if-no-files-found: ignore
