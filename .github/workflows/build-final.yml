name: Build mssh customer release

on:
  push:
    paths:
      - 'mssh-final-auto.zip'
      - '.github/workflows/build-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mssh-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('final-source').resolve()
          root.mkdir()
          with ZipFile('mssh-final-auto.zip') as z:
              for item in z.infolist():
                  if not (root / item.filename).resolve().is_relative_to(root):
                      raise ValueError('Unsafe ZIP path')
              if z.testzip() is not None:
                  raise ValueError('Corrupt archive')
              z.extractall(root)
          for name in ('settings.gradle.kts', 'app/build.gradle.kts', 'app/src/main/jni/hev/Android.mk'):
              if not (root / name).is_file():
                  raise FileNotFoundError(name)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MSSH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MSSH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MSSH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MSSH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. See RELEASE-1.0.0.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mssh-release.p12"
      - name: Compile, test and lint
        working-directory: final-source
        env:
          MSSH_KEYSTORE_PATH: ${{ runner.temp }}/mssh-release.p12
          MSSH_STORE_PASSWORD: ${{ secrets.MSSH_STORE_PASSWORD }}
          MSSH_KEY_ALIAS: ${{ secrets.MSSH_KEY_ALIAS }}
          MSSH_KEY_PASSWORD: ${{ secrets.MSSH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs final-source/app/build/outputs/apk/release/app-release.apk
      - name: APK checksum
        working-directory: final-source/app/build/outputs/apk/release
        run: |
          mv app-release.apk mssh-1.0.0.apk
          sha256sum mssh-1.0.0.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mssh-1.0.0-release
          path: |
            final-source/app/build/outputs/apk/release/mssh-1.0.0.apk
            final-source/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mssh-release.p12"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mssh-build-diagnostics
          path: |
            final-source/build.log
            final-source/app/build/reports/
          if-no-files-found: ignore
